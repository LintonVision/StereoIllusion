<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Two Circles - Angular Oscillation</title>
  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    // ========================================
    // MAIN PARAMETERS - MATCHING PSYCHTOOLBOX
    // ========================================
    
    // Viewing geometry
    const IPD_CM = 6.4;  // Interpupillary distance
    const VIEW_DIST_CM = 40;  // Distance from eyes to screen
    
    // Distance definitions (matching PsychToolbox)
    const DIST1 = 50;  // Back Circle Far (constant)
    const THETA1 = Math.atan(DIST1 / (0.5 * IPD_CM)) * 180 / Math.PI;
    
    const DIST2_INITIAL = 40;  // Back Circle Near (initial)
    const THETA2_INITIAL = Math.atan(DIST2_INITIAL / (0.5 * IPD_CM)) * 180 / Math.PI;
    
    // Calculate initial front circle distances
    const THETA3A_INITIAL = THETA2_INITIAL - (THETA1 - THETA2_INITIAL);  // Right Front Circle
    const DIST3A_INITIAL = Math.tan(THETA3A_INITIAL * Math.PI / 180) * (0.5 * IPD_CM);
    
    const DIST3B_INITIAL = DIST2_INITIAL - (DIST1 - DIST2_INITIAL);  // Left Front Circle
    const THETA3B_INITIAL = Math.atan(DIST3B_INITIAL / (0.5 * IPD_CM)) * 180 / Math.PI;
    
    // Animation parameters
    const TIME_PER_CYCLE = 0.4;  // Time per revolution (seconds)
    
    // Screen shifts for the two stimuli
    const SCREEN_SHIFT_LEFT = 4.0;   // Left stimulus shifted +4cm
    const SCREEN_SHIFT_RIGHT = -4.0;  // Right stimulus shifted -4cm
    
    // ========================================
    // DERIVED PARAMETERS
    // ========================================
    
    const SHIFT_L = -IPD_CM / 2;
    const SHIFT_R = +IPD_CM / 2;

    const BORDER_SCREEN_PX = 10;
    const DOT_SIZE_CM = 0.4;  // 0.4cm wide dots
    const CIRCLE_RADIUS_CM = 4.0;  // Outer radius of main circle (large enough so rings touch)

    function cssPPI(){
      const d=document.createElement('div'); d.style.width='1in'; d.style.position='absolute'; d.style.visibility='hidden';
      document.body.appendChild(d); const p=d.offsetWidth||96; d.remove(); return p;
    }
    
    function estimateCanvasCM(){
      const ppi = cssPPI();
      const pxW = window.innerWidth, pxH = window.innerHeight;
      const inW = pxW/ppi, inH = pxH/ppi; const CM = 2.54;
      return { w: inW*CM, h: inH*CM, pxW, pxH, ppi, cmPerPx: (1/ppi)*2.54 };
    }

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    
    // Fix canvas size at initialization
    const FIXED_WIDTH = window.innerWidth;
    const FIXED_HEIGHT = window.innerHeight;
    renderer.setSize(FIXED_WIDTH, FIXED_HEIGHT);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.domElement.style.transformOrigin = 'top left';
    document.body.appendChild(renderer.domElement);

    // Create two separate scenes
    const sceneLeft = new THREE.Scene();
    const sceneRight = new THREE.Scene();

    function makeDotTexture(size=64){
      const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d');
      g.clearRect(0,0,size,size);
      const cx=size/2, cy=size/2, r=size*0.45;
      g.fillStyle='rgba(255,255,255,1)';
      g.beginPath(); 
      g.arc(cx,cy,r,0,Math.PI*2); 
      g.fill();
      const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
      return t;
    }
    const dotTexture = makeDotTexture();

    function buildCircleUnit(dotSizePx){
      const grp = new THREE.Group();
      
      // Main ring
      const ringGeo = new THREE.RingGeometry(0.9, 1.0, 256, 1);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.renderOrder = 2;
      grp.add(ring);

      // Horizontal dots (left/right) - these will be at fixed 40cm distance
      const crossRadius = 0.7 * 2.5;  // Matching MATLAB: 0.7*2.5 cm
      const posHorizontal = new Float32Array(2 * 3);
      
      // Right dot
      posHorizontal[0] = crossRadius; posHorizontal[1] = 0; posHorizontal[2] = 0;
      // Left dot
      posHorizontal[3] = -crossRadius; posHorizontal[4] = 0; posHorizontal[5] = 0;
      
      const geoHorizontal = new THREE.BufferGeometry();
      geoHorizontal.setAttribute('position', new THREE.BufferAttribute(posHorizontal, 3));
      const matHorizontal = new THREE.PointsMaterial({
        map: dotTexture,
        size: dotSizePx,
        sizeAttenuation: false,
        transparent: true,
        depthWrite: false,
        color: 0xffffff
      });
      const dotsHorizontal = new THREE.Points(geoHorizontal, matHorizontal);
      dotsHorizontal.renderOrder = 1;
      grp.add(dotsHorizontal);

      // Vertical dots (top/bottom) - these will oscillate
      const vertRadius = 0.7 * 2;  // Matching MATLAB: 0.7*2 cm
      const posVertical = new Float32Array(2 * 3);
      
      // Top dot
      posVertical[0] = 0; posVertical[1] = vertRadius; posVertical[2] = 0;
      // Bottom dot
      posVertical[3] = 0; posVertical[4] = -vertRadius; posVertical[5] = 0;
      
      const geoVertical = new THREE.BufferGeometry();
      geoVertical.setAttribute('position', new THREE.BufferAttribute(posVertical, 3));
      const matVertical = new THREE.PointsMaterial({
        map: dotTexture,
        size: dotSizePx,
        sizeAttenuation: false,
        transparent: true,
        depthWrite: false,
        color: 0xffffff
      });
      const dotsVertical = new THREE.Points(geoVertical, matVertical);
      dotsVertical.renderOrder = 1;
      grp.add(dotsVertical);

      grp.userData = { ring, dotsHorizontal, dotsVertical, matHorizontal, matVertical, lastOuter: -1, lastInner: -1 };
      return grp;
    }

    let spec = estimateCanvasCM();
    function computeFOV(){ return 2*Math.atan((spec.h/2)/VIEW_DIST_CM)*180/Math.PI; }
    
    // Create all four cameras
    const camL = new THREE.PerspectiveCamera(computeFOV(), spec.w/spec.h, 0.1, 2000);
    const camR = new THREE.PerspectiveCamera(computeFOV(), spec.w/spec.h, 0.1, 2000);
    const camL2 = new THREE.PerspectiveCamera(computeFOV(), spec.w/spec.h, 0.1, 2000);
    const camR2 = new THREE.PerspectiveCamera(computeFOV(), spec.w/spec.h, 0.1, 2000);
    
    function setPoseAndFrustum(cam, eyeXcm, screenShift){
      cam.position.set(eyeXcm, 0, VIEW_DIST_CM);
      const n=cam.near, f=cam.far;
      const halfW = spec.w*0.5, halfH = spec.h*0.5;
      const top = (+halfH) * (n/VIEW_DIST_CM);
      const bottom = (-halfH) * (n/VIEW_DIST_CM);
      const left  = (-halfW - eyeXcm + screenShift) * (n/VIEW_DIST_CM);
      const right = ( +halfW - eyeXcm + screenShift) * (n/VIEW_DIST_CM);
      const m=new THREE.Matrix4();
      const x = 2*n/(right-left), y=2*n/(top-bottom);
      const a = (right+left)/(right-left), b=(top+bottom)/(top-bottom);
      const c = -(f+n)/(f-n), d = -2*f*n/(f-n);
      m.set(x,0,a,0,  0,y,b,0,  0,0,c,d,  0,0,-1,0);
      cam.projectionMatrix.copy(m);
      cam.projectionMatrixInverse.copy(m).invert();
      cam.updateMatrixWorld(true);
    }
    
    // Set up all four cameras
    setPoseAndFrustum(camL, SHIFT_L, SCREEN_SHIFT_LEFT);
    setPoseAndFrustum(camR, SHIFT_R, SCREEN_SHIFT_LEFT);
    setPoseAndFrustum(camL2, SHIFT_L, SCREEN_SHIFT_RIGHT);
    setPoseAndFrustum(camR2, SHIFT_R, SCREEN_SHIFT_RIGHT);

    const borderScreenCm = spec.cmPerPx * BORDER_SCREEN_PX;
    
    // Create circles for left stimulus (using Dist3B logic)
    const leftCircle = buildCircleUnit(DOT_SIZE_CM / spec.cmPerPx);
    sceneLeft.add(leftCircle);
    
    // Create circles for right stimulus (using Dist3A logic)
    const rightCircle = buildCircleUnit(DOT_SIZE_CM / spec.cmPerPx);
    sceneRight.add(rightCircle);

    const BORDER_ALPHA_RAD = 2 * Math.atan((borderScreenCm*0.5) / VIEW_DIST_CM);

    function updateRing(grp, outerR, innerR){
      const eps = 1e-3;
      if (Math.abs(outerR - grp.userData.lastOuter) < eps && Math.abs(innerR - grp.userData.lastInner) < eps) return;
      grp.userData.lastOuter = outerR; grp.userData.lastInner = innerR;

      grp.remove(grp.userData.ring);
      grp.userData.ring.geometry.dispose();

      const ringGeo = new THREE.RingGeometry(innerR, outerR, 384, 1);
      const ring = new THREE.Mesh(ringGeo, grp.userData.ring.material);
      ring.renderOrder = 2;
      grp.userData.ring = ring; 
      grp.add(ring);
    }

    function makeRT(){
      const s=new THREE.Vector2(); renderer.getDrawingBufferSize(s);
      return new THREE.WebGLRenderTarget(s.x, s.y, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat });
    }
    
    // Create render targets for all four cameras
    let rtL = makeRT(), rtR = makeRT(), rtL2 = makeRT(), rtR2 = makeRT();
    
    const fsScene = new THREE.Scene();
    const fsCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    const fsMat = new THREE.ShaderMaterial({
      uniforms:{
        texL:{value:rtL.texture}, 
        texR:{value:rtR.texture},
        texL2:{value:rtL2.texture},
        texR2:{value:rtR2.texture}
      },
      vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
      fragmentShader:`precision highp float; varying vec2 vUv; 
        uniform sampler2D texL, texR, texL2, texR2;
        void main(){ 
          vec3 L=texture2D(texL,vUv).rgb; 
          vec3 R=texture2D(texR,vUv).rgb;
          vec3 L2=texture2D(texL2,vUv).rgb;
          vec3 R2=texture2D(texR2,vUv).rgb;
          // Combine first pair (left stimulus) in red-cyan
          vec3 col1=vec3(L.r,0.0,R.b);
          // Combine second pair (right stimulus) in red-cyan
          vec3 col2=vec3(L2.r,0.0,R2.b);
          // Add both stereo pairs
          vec3 col = (col1 + col2);
          gl_FragColor=vec4(col,1.0); 
        }`,
      depthTest:false, depthWrite:false
    });
    fsScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), fsMat));

    function distToZ(d){ return VIEW_DIST_CM - d; }

    // Set rings to fixed position at 40cm
    const RING_DIST = 40;
    leftCircle.position.z = distToZ(RING_DIST);
    rightCircle.position.z = distToZ(RING_DIST);
    
    // Set ring sizes (fixed)
    const ringScale = RING_DIST / VIEW_DIST_CM;
    const ringOuterR = CIRCLE_RADIUS_CM * ringScale;
    const ringBorder = 2 * RING_DIST * Math.tan(BORDER_ALPHA_RAD/2);
    const ringInnerR = Math.max(0, ringOuterR - ringBorder);
    
    updateRing(leftCircle, ringOuterR, ringInnerR);
    updateRing(rightCircle, ringOuterR, ringInnerR);

    function animate(){
      requestAnimationFrame(animate);

      // Calculate oscillation phase (matching PsychToolbox)
      const time = performance.now() / 1000;  // Time in seconds
      const phase = Math.cos(Math.PI * (1 + time / TIME_PER_CYCLE));  // Cosine oscillation
      
      // Calculate Dist2 (back circle oscillation between DIST2_INITIAL and DIST1)
      // This is for horizontal dots: 50cm to 40cm
      const THETA2 = THETA2_INITIAL + (THETA1 - THETA2_INITIAL) * 0.5 * (phase + 1);
      const Dist2 = Math.tan(THETA2 * Math.PI / 180) * (0.5 * IPD_CM);
      
      // Calculate Dist3A (right front circle - follows angular relationship)
      const THETA3A = THETA3A_INITIAL + (THETA2_INITIAL - THETA3A_INITIAL) * 0.5 * (phase + 1);
      const Dist3A = Math.tan(THETA3A * Math.PI / 180) * (0.5 * IPD_CM);
      
      // Calculate Dist3B (left front circle - follows linear relationship)
      const THETA3B = THETA3B_INITIAL + (THETA2_INITIAL - THETA3B_INITIAL) * 0.5 * (phase + 1);
      const Dist3B = Math.tan(THETA3B * Math.PI / 180) * (0.5 * IPD_CM);
      
      // Update LEFT STIMULUS
      // Horizontal dots: oscillate from 50cm to 40cm (Dist2)
      leftCircle.userData.dotsHorizontal.position.z = distToZ(Dist2) - distToZ(RING_DIST);
      const horzDotSizeLeft = (DOT_SIZE_CM * (VIEW_DIST_CM / Dist2)) / spec.cmPerPx;
      leftCircle.userData.matHorizontal.size = horzDotSizeLeft;
      
      // Vertical dots: oscillate from 40cm to near position (Dist3B)
      const leftDist = Dist3B;
      leftCircle.userData.dotsVertical.position.z = distToZ(leftDist) - distToZ(RING_DIST);
      const leftDotSize = (DOT_SIZE_CM * (VIEW_DIST_CM / leftDist)) / spec.cmPerPx;
      leftCircle.userData.matVertical.size = leftDotSize;
      
      // Update RIGHT STIMULUS
      // Horizontal dots: oscillate from 50cm to 40cm (Dist2)
      rightCircle.userData.dotsHorizontal.position.z = distToZ(Dist2) - distToZ(RING_DIST);
      const horzDotSizeRight = (DOT_SIZE_CM * (VIEW_DIST_CM / Dist2)) / spec.cmPerPx;
      rightCircle.userData.matHorizontal.size = horzDotSizeRight;
      
      // Vertical dots: oscillate from 40cm to near position (Dist3A)
      const rightDist = Dist3A;
      rightCircle.userData.dotsVertical.position.z = distToZ(rightDist) - distToZ(RING_DIST);
      const rightDotSize = (DOT_SIZE_CM * (VIEW_DIST_CM / rightDist)) / spec.cmPerPx;
      rightCircle.userData.matVertical.size = rightDotSize;

      // Render left stimulus from first stereo pair
      renderer.setRenderTarget(rtL); renderer.render(sceneLeft, camL);
      renderer.setRenderTarget(rtR); renderer.render(sceneLeft, camR);
      
      // Render right stimulus from second stereo pair
      renderer.setRenderTarget(rtL2); renderer.render(sceneRight, camL2);
      renderer.setRenderTarget(rtR2); renderer.render(sceneRight, camR2);
      
      renderer.setRenderTarget(null); renderer.render(fsScene, fsCam);
    }
    animate();

    window.addEventListener('resize', ()=>{
      // Scale the canvas proportionally instead of recalculating
      const scaleX = window.innerWidth / FIXED_WIDTH;
      const scaleY = window.innerHeight / FIXED_HEIGHT;
      const scale = Math.min(scaleX, scaleY);
      
      renderer.domElement.style.transform = `scale(${scale})`;
    });
  </script>
</body>
</html>
